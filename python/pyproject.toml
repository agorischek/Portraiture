[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portraiture"
version = "0.1.0"
description = "Run dependency-free environment collection scripts and capture their output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Portraiture contributors" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/agorischek/Portraiture"
Repository = "https://github.com/agorischek/Portraiture"
Issues = "https://github.com/agorischek/Portraiture/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portraiture = ["py.typed"]

